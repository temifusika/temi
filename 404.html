<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · Temi Ogunfusika</title>
<style>
:root{--bg:#F5F4F2;--ink:#111113;--mute:#76767C;--line:#E4E2DE;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.box{position:relative;text-align:center;max-width:560px}
svg{width:min(520px,90vw);height:auto;display:block;margin:0 auto}
.beam{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .2s ease-out forwards}
.ray{opacity:0;animation:fan .9s 1.1s ease-out forwards}
.num{font:700 120px/1 Inter,system-ui,sans-serif;letter-spacing:-.06em;fill:var(--ink)}
h1{margin:8px 0 6px;font-size:28px;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 0 22px;color:var(--mute)}
a.pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;text-decoration:none;padding:13px 20px;border-radius:999px;font-weight:600}
a.pill:focus-visible{outline:3px solid #0A84FF;outline-offset:3px}
.links{margin-top:14px;font-size:14px}.links a{color:var(--ink);margin:0 8px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fan{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.beam,.ray{animation:none;stroke-dashoffset:0;opacity:1}}
</style>
</head>
<body>
<main class="box">
<svg viewBox="0 0 520 240" role="img" aria-label="A beam of light hits a prism and splits into colours that spell 404">
 <line class="beam" x1="0" y1="40" x2="196" y2="128" stroke="#C9C7C2" stroke-width="5" stroke-linecap="round"/>
 <path d="M200 182 L240 82 L282 182 Z" fill="#FFFFFF" stroke="#111113" stroke-width="3"/>
 <g class="ray" stroke-width="4" stroke-linecap="round">
  <line x1="262" y1="132" x2="520" y2="96" stroke="#FF3B30"/><line x1="262" y1="135" x2="520" y2="116" stroke="#FF9500"/>
  <line x1="262" y1="138" x2="520" y2="136" stroke="#FFCC00"/><line x1="262" y1="141" x2="520" y2="156" stroke="#34C759"/>
  <line x1="262" y1="144" x2="520" y2="176" stroke="#0A84FF"/><line x1="262" y1="147" x2="520" y2="196" stroke="#8E5CF7"/>
 </g>
 <text class="num ray" x="300" y="236" text-anchor="start" style="font-size:72px">404</text>
</svg>
<h1>This page split into nothing.</h1>
<p>The address may have moved, or it never existed. Every other layer is still here.</p>

<div class="links"><a href="/#work">Work</a><a href="/agents/">Agents</a><a href="mailto:me@temifusika.com">Email</a></div>
</main>
</body>
</html>
